<div>
  <button id="reset-origin">Reset Origin</button>
  <button id="toggle-trajectory">Toggle Trajectory</button>
  <button id="toggle-velocity">Toggle Velocity</button>
</div>
<div id="plotly-chart" style="width:90vw; height:60vh;"></div>

<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
const chartDiv = document.getElementById('plotly-chart');

// Data arrays for 2D position tracking
const positionData = {
  x: [],
  y: [],
  vx: [],
  vy: [],
  timestamp: []
};

// Sensor fusion state variables
let quaternion = [1.0, 0.0, 0.0, 0.0]; // [w, x, y, z] - initial quaternion (no rotation)
let gravity = [0, 0, 9.81]; // gravity vector in world frame
const ALPHA = 0.98; // Complementary filter constant
const GYRO_NOISE_THRESHOLD = 0.1; // Threshold for gyro noise (rad/s)
const ACCEL_NOISE_THRESHOLD = 2.0; // Threshold for detecting excessive acceleration (g)

// Position tracking parameters
const POSITION_TOLERANCE = 0.001; // Minimum movement threshold in meters (1mm)
const VELOCITY_TOLERANCE = 0.01; // Minimum velocity threshold in m/s
const SCALE_FACTOR = 100; // Scale factor to convert from m to cm for better visualization
const SAMPLE_RATE = 50; // Target sample rate in Hz (20ms intervals)

// Origin reference - set when page loads
let originSet = false;
let originPosition = { x: 0, y: 0 };
let originQuaternion = [1.0, 0.0, 0.0, 0.0];

// Plotly initial traces for 2D position visualization
const traceConfig = [
  { 
    name: 'Position', 
    x: [], 
    y: [], 
    mode: 'lines+markers', 
    line: { color: 'blue', width: 2 }, 
    marker: { size: 4 },
    visible: true 
  },
  { 
    name: 'Velocity Vectors', 
    x: [], 
    y: [], 
    mode: 'lines', 
    line: { color: 'red', width: 1, dash: 'dot' }, 
    visible: false 
  },
  { 
    name: 'Origin', 
    x: [0], 
    y: [0], 
    mode: 'markers', 
    marker: { size: 10, color: 'green', symbol: 'star' }, 
    visible: true 
  }
];

Plotly.newPlot(chartDiv, traceConfig, {
  title: '2D Phone Position Tracking',
  xaxis: { title: 'X Position (cm)', scaleanchor: 'y', scaleratio: 1 },
  yaxis: { title: 'Y Position (cm)' },
  showlegend: true
});

// Button event listeners
document.getElementById('reset-origin').addEventListener('click', () => {
  resetOrigin();
});

document.getElementById('toggle-trajectory').addEventListener('click', () => {
  Plotly.restyle(chartDiv, {'visible': [!positionData.x.length ? false : true]}, [0]);
});

document.getElementById('toggle-velocity').addEventListener('click', () => {
  Plotly.restyle(chartDiv, {'visible': [!positionData.vx.length ? false : true]}, [1]);
});

// Origin reset function
function resetOrigin() {
  originSet = true;
  originPosition = { x: 0, y: 0 };
  originQuaternion = [...quaternion];
  
  // Clear position data
  positionData.x = [];
  positionData.y = [];
  positionData.vx = [];
  positionData.vy = [];
  positionData.timestamp = [];
  
  // Reset quaternion
  quaternion = [1.0, 0.0, 0.0, 0.0];
  
  // Reset tracking variables
  lastAccel2D = null;
  lastUpdateTime = 0;
  firstDataReceived = false;
  
  // Update plot
  Plotly.restyle(chartDiv, {
    x: [[], [], [0]],
    y: [[], [], [0]]
  }, [0, 1, 2]);
}

// Quaternion utility functions
function quaternionMultiply(q1, q2) {
  const [w1, x1, y1, z1] = q1;
  const [w2, x2, y2, z2] = q2;
  return [
    w1*w2 - x1*x2 - y1*y2 - z1*z2,
    w1*x2 + x1*w2 + y1*z2 - z1*y2,
    w1*y2 - x1*z2 + y1*w2 + z1*x2,
    w1*z2 + x1*y2 - y1*x2 + z1*w2
  ];
}

function quaternionNormalize(q) {
  const norm = Math.sqrt(q[0]*q[0] + q[1]*q[1] + q[2]*q[2] + q[3]*q[3]);
  return norm > 0 ? [q[0]/norm, q[1]/norm, q[2]/norm, q[3]/norm] : [1, 0, 0, 0];
}

function quaternionConjugate(q) {
  return [q[0], -q[1], -q[2], -q[3]];
}

function rotateVectorByQuaternion(vec, q) {
  // Convert vector to quaternion [0, x, y, z]
  const vecQuat = [0, vec[0], vec[1], vec[2]];
  const qConj = quaternionConjugate(q);
  const rotated = quaternionMultiply(quaternionMultiply(q, vecQuat), qConj);
  return [rotated[1], rotated[2], rotated[3]];
}

function vector3Magnitude(vec) {
  return Math.sqrt(vec[0]*vec[0] + vec[1]*vec[1] + vec[2]*vec[2]);
}

function vector3Normalize(vec) {
  const mag = vector3Magnitude(vec);
  return mag > 0 ? [vec[0]/mag, vec[1]/mag, vec[2]/mag] : [0, 0, 0];
}

function vector3Cross(a, b) {
  return [
    a[1]*b[2] - a[2]*b[1],
    a[2]*b[0] - a[0]*b[2],
    a[0]*b[1] - a[1]*b[0]
  ];
}

function vector3Dot(a, b) {
  return a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
}

// Improved sensor fusion with better drift correction
function updateOrientationWithSensorFusion(accel, gyro, dt) {
  // Convert gyro from degrees/sec to radians/sec
  const gyroRad = gyro.map(g => g * (Math.PI / 180));

  // Step 1: Integrate gyroscope to get orientation change
  const gyroMagnitude = vector3Magnitude(gyroRad);
  if (gyroMagnitude > GYRO_NOISE_THRESHOLD && dt > 0) {
    const axis = vector3Normalize(gyroRad);
    const angle = gyroMagnitude * dt;

    // Create rotation quaternion from axis-angle
    const halfAngle = angle * 0.5;
    const sinHalfAngle = Math.sin(halfAngle);
    const deltaQ = [
      Math.cos(halfAngle),
      axis[0] * sinHalfAngle,
      axis[1] * sinHalfAngle,
      axis[2] * sinHalfAngle
    ];

    // Update quaternion with gyro integration
    quaternion = quaternionNormalize(quaternionMultiply(quaternion, deltaQ));
  }

  // Step 2: Use accelerometer for drift correction (complementary filter)
  const accelMagnitude = vector3Magnitude(accel);

  // Only use accelerometer if it's close to 1g (not under excessive acceleration)
  if (Math.abs(accelMagnitude - 9.81) < ACCEL_NOISE_THRESHOLD) {
    // Normalize accelerometer reading
    const accelNorm = vector3Normalize(accel);

    // Expected gravity direction in body frame
    const expectedGravity = rotateVectorByQuaternion(gravity, quaternion);
    const expectedGravityNorm = vector3Normalize(expectedGravity);

    // Calculate error between measured and expected gravity
    const error = vector3Cross(accelNorm, expectedGravityNorm);
    const errorMagnitude = vector3Magnitude(error);

    if (errorMagnitude > 0.001) {
      // Create correction quaternion
      const errorAxis = vector3Normalize(error);
      const correctionAngle = errorMagnitude * (1 - ALPHA) * dt;
      const halfCorrectionAngle = correctionAngle * 0.5;
      const sinHalfCorrection = Math.sin(halfCorrectionAngle);

      const correctionQ = [
        Math.cos(halfCorrectionAngle),
        errorAxis[0] * sinHalfCorrection,
        errorAxis[1] * sinHalfCorrection,
        errorAxis[2] * sinHalfCorrection
      ];

      // Apply correction to quaternion
      quaternion = quaternionNormalize(quaternionMultiply(correctionQ, quaternion));
    }
  }

  return quaternion;
}

function removeGravityFromAcceleration(rawAccel) {
  // Get current gravity vector in body frame using quaternion
  const gravityInBodyFrame = rotateVectorByQuaternion(gravity, quaternionConjugate(quaternion));

  // Subtract gravity to get linear acceleration
  return [
    rawAccel[0] - gravityInBodyFrame[0],
    rawAccel[1] - gravityInBodyFrame[1],
    rawAccel[2] - gravityInBodyFrame[2]
  ];
}

// Improved integration with drift correction
function integratePosition(prevPos, prevVel, prevAccel, currAccel, dt) {
  // Use trapezoidal rule for better accuracy
  const avgAccel = (prevAccel + currAccel) / 2;
  const newVel = prevVel + avgAccel * dt;
  const avgVel = (prevVel + newVel) / 2;
  const newPos = prevPos + avgVel * dt;
  
  return { velocity: newVel, position: newPos };
}

// Convert 3D acceleration to 2D (project onto horizontal plane)
function projectTo2D(accel3D) {
  // For 2D tracking, we use X and Y components
  // Z component is typically vertical and less useful for horizontal movement
  return [accel3D[0], accel3D[1]];
}

// Apply tolerance filtering to reduce micro-movements
function applyToleranceFilter(accel, prevAccel) {
  if (!prevAccel) return accel;
  
  const filteredAccel = [];
  for (let i = 0; i < accel.length; i++) {
    const diff = Math.abs(accel[i] - prevAccel[i]);
    if (diff < POSITION_TOLERANCE * 0.1) { // Much smaller threshold for acceleration
      // If change is below tolerance, use previous value (dead zone)
      filteredAccel.push(prevAccel[i]);
    } else {
      // Apply light smoothing to reduce noise
      filteredAccel.push(prevAccel[i] + (accel[i] - prevAccel[i]) * 0.9);
    }
  }
  return filteredAccel;
}

// Scale position for better visualization (meters to centimeters)
function scalePosition(pos) {
  return pos * SCALE_FACTOR;
}

// Check if movement is significant enough to update
function isSignificantMovement(newPos, prevPos) {
  const dx = newPos.x - prevPos.x;
  const dy = newPos.y - prevPos.y;
  const distance = Math.sqrt(dx * dx + dy * dy);
  return distance > POSITION_TOLERANCE * SCALE_FACTOR * 0.1; // Much smaller threshold (0.1mm in cm)
}

const socket = io();

// Initialize origin on first data
let firstDataReceived = false;
let lastAccel2D = null;
let lastUpdateTime = 0;

socket.on('accel-data', data => {
  // Handle the new data structure
  let rawAccel, currentTime;
  if (data.acceleration) {
    // New structure with acceleration object
    rawAccel = [data.acceleration.x, data.acceleration.y, data.acceleration.z];
    currentTime = data.acceleration.timestamp;
  } else {
    // Old structure with direct properties
    rawAccel = [data.x, data.y, data.z];
    currentTime = data.timestamp;
  }
  
  // Calculate dt with higher sample rate
  const dt = lastUpdateTime > 0 ? (currentTime - lastUpdateTime) / 1000.0 : 1.0 / SAMPLE_RATE;
  
  // Set origin on first data received
  if (!firstDataReceived) {
    resetOrigin();
    firstDataReceived = true;
    lastUpdateTime = currentTime;
  }
  
  // Only process if enough time has passed for target sample rate
  if (dt < (1.0 / SAMPLE_RATE)) {
    return; // Skip this sample to maintain target rate
  }
  
  lastUpdateTime = currentTime;
  
  // Get gravity-compensated acceleration
  const fusedAccel = removeGravityFromAcceleration(rawAccel);
  const accel2D = projectTo2D(fusedAccel);
  
  // Apply tolerance filtering
  const filteredAccel2D = applyToleranceFilter(accel2D, lastAccel2D);
  lastAccel2D = filteredAccel2D;
  
  // Calculate 2D position and velocity
  const lastIdx = positionData.timestamp.length - 1;
  
  if (lastIdx < 0) {
    // First data point - initialize
    positionData.timestamp.push(currentTime);
    positionData.x.push(0);
    positionData.y.push(0);
    positionData.vx.push(0);
    positionData.vy.push(0);
  } else {
    // Integrate to get velocity and position
    const xIntegration = integratePosition(
      positionData.x[lastIdx],
      positionData.vx[lastIdx],
      lastIdx > 0 ? (positionData.vx[lastIdx] - positionData.vx[lastIdx-1]) / dt : 0,
      filteredAccel2D[0],
      dt
    );
    
    const yIntegration = integratePosition(
      positionData.y[lastIdx],
      positionData.vy[lastIdx],
      lastIdx > 0 ? (positionData.vy[lastIdx] - positionData.vy[lastIdx-1]) / dt : 0,
      filteredAccel2D[1],
      dt
    );
    
    // Store timestamp and scaled position data (removed significance check for now)
    positionData.timestamp.push(currentTime);
    positionData.x.push(scalePosition(xIntegration.position));
    positionData.y.push(scalePosition(yIntegration.position));
    positionData.vx.push(scalePosition(xIntegration.velocity));
    positionData.vy.push(scalePosition(yIntegration.velocity));
    
    // Update plot with 2D position data
    const currentX = positionData.x[positionData.x.length - 1];
    const currentY = positionData.y[positionData.y.length - 1];
    const currentVx = positionData.vx[positionData.vx.length - 1];
    const currentVy = positionData.vy[positionData.vy.length - 1];
    
    // Create velocity vectors for visualization
    const velocityVectors = [];
    if (positionData.x.length > 1) {
      // Show velocity as arrows from current position (scaled for visibility)
      velocityVectors.push(currentX, currentX + currentVx * 0.5);
      velocityVectors.push(currentY, currentY + currentVy * 0.5);
    }
    
    Plotly.extendTraces(
      chartDiv,
      {
        x: [
          [currentX], // position x
          velocityVectors.length > 0 ? velocityVectors.slice(0, 2) : [], // velocity x
          [0] // origin x
        ],
        y: [
          [currentY], // position y
          velocityVectors.length > 0 ? velocityVectors.slice(2, 4) : [], // velocity y
          [0] // origin y
        ]
      },
      [0, 1, 2], 1000 // Keep last 1000 points
    );
  }
});

socket.on('gyro-data', data => {
  // Debug: Log the complete gyro data structure
  console.log('Gyro data received in main page:', data);
  
  // Handle the new data structure
  let gyro;
  if (data.rotationRate) {
    gyro = [data.rotationRate.alpha, data.rotationRate.beta, data.rotationRate.gamma];
  } else if (data.alpha !== undefined) {
    gyro = [data.alpha, data.beta, data.gamma];
  } else if (data.x !== undefined) {
    gyro = [data.x, data.y, data.z];
  } else {
    console.error('Unknown gyro data structure in main page:', data);
    return;
  }
  
  // Get the most recent accelerometer data for sensor fusion
  if (positionData.timestamp.length > 0) {
    const lastIdx = positionData.timestamp.length - 1;
    const latestAccel = [
      positionData.x.length > lastIdx ? (positionData.x[lastIdx] - (positionData.x[lastIdx-1] || 0)) / SCALE_FACTOR : 0,
      positionData.y.length > lastIdx ? (positionData.y[lastIdx] - (positionData.y[lastIdx-1] || 0)) / SCALE_FACTOR : 0,
      0 // We don't use Z for 2D tracking
    ];
    
    // Calculate dt
    const dt = lastIdx > 0 ? (positionData.timestamp[lastIdx] - positionData.timestamp[lastIdx-1]) / 1000.0 : 0.01;
    
    // Update orientation using sensor fusion
    updateOrientationWithSensorFusion(latestAccel, gyro, dt);
  }
});
</script>
